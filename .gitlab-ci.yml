stages:
  - quality
  - build
  - publish

variables:
  LANG: 'en_US.UTF-8'
  LC_ALL: 'en_US.UTF-8'
  ENVFILE: .env.production
  VERSION_ID: $CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG-$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA
  NODE_VERSION: 18.16.1
  BUNDLER_VERSION: 1.14.6

quality control:
  image: node:$NODE_VERSION
  stage: quality
  script:
    - yarn install --frozen-lockfile
    - echo "{}">.env.json
    - yarn build
    - yarn lint
    - yarn test
  only:
    - develop
    - merge_requests
    - tags


ios develop:
  tags:
    - ios
  stage: build
  script:
    - gem --version
    - ruby --version
    - echo fetch API_ROOT
    - doppler secrets get API_ROOT --plain
    - gem install bundler -v $BUNDLER_VERSION || echo "gem install bundler failed"
    - bundle install
    - nvm install $NODE_VERSION && nvm use $NODE_VERSION
    - yarn cache clean
    - yarn install --frozen-lockfile
    - echo '{}'>.env.json
    - yarn react-native-vector-image generate
    - bundle exec pod repo update
    - export ITMSTRANSPORTER_FORCE_ITMS_PACKAGE_UPLOAD=true
    - bundle exec fastlane ios beta
    - mkdir output
    - mv NeobankDev.ipa ./output/DEV-app-develop-$VERSION_ID.ipa
    - mv NeobankDev.app.dSYM.zip ./output/DEV-app-develop-$VERSION_ID.app.dSYM.zip
  timeout: 1h 30m
  only:
    - develop
  environment:
    name: development
  variables:
    MATCH_PASSWORD: $MATCH_PASSWORD
  artifacts:
    paths:
      - fastlane/screenshots
      - fastlane/logs
      - output/

