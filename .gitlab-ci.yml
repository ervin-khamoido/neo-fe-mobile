android develop:
  tags:
    - android
  stage: build
  script:
    - echo fetch API_ROOT
    - doppler secrets get API_ROOT --plain
    - gem install bundler -v $BUNDLER_VERSION || echo "gem install bundler failed"
    - bundle install
    - nvm install $NODE_VERSION && nvm use $NODE_VERSION
    # - npm install -g @sentry/cli --unsafe-perm
    - yarn install --frozen-lockfile
    - echo '{}'>.env.json
    - yarn react-native-vector-image generate
    # - echo VERSION_ID=$VERSION_ID >> $ENVFILE
    # - echo REVENUE_CAT_KEY=$REVENUE_CAT_KEY >> $ENVFILE
    # - echo STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY >> $ENVFILE
    - mkdir -p tmp
    - git clone --branch master $KEY_REPO './tmp/deploy'
    # - openssl des -d -in ./tmp/deploy/android/key.json.enc -out android_key.json -pass pass:$MATCH_PASSWORD
    - bundle exec fastlane android build
    - rm -rf tmp
    # - rm android_key.json
    - mkdir output
    - mv android/app/build/outputs/apk/release/app-release.apk ./output/DEV-app-develop-$VERSION_ID.apk
    # upload the artifacts to a Google Drive
    - doppler secrets get CI_GOOGLE_SERVICE_ACCOUNT --plain>neobank-app-service-account.json
    - doppler run -- bundle exec fastlane android upload_artifacts_to_google_drive
    - rm neobank-app-service-account.json
  only:
    - develop
  environment:
    name: development
  variables:
    KEY_REPO: https://${MOBILE_DEPLOY_USER}:${MOBILE_DEPLOY_PASSWORD}@gitlab.com/build-credit-with-me-llc/neobank/mobile-keystore.git
    RELEASE_STORE_FILE: $CI_PROJECT_DIR/tmp/deploy/android/$ANDROID_KEYSTORE_PATH
    RELEASE_STORE_PASSWORD: $ANDROID_KEYSTORE_PASSWORD
    RELEASE_KEY_ALIAS: neobank-key
    RELEASE_KEY_PASSWORD: $ANDROID_CERTIFICATE_PASSWORD
  artifacts:
    paths:
      - output/

