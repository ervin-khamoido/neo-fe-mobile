    - mv NeobankDev.app.dSYM.zip ./output/DEV-app-develop-feature-$VERSION_ID.app.dSYM.zip
  timeout: 1h 30m
  except:
    - main
    - develop
  when: manual
  environment:
    name: development
  variables:
    MATCH_PASSWORD: $MATCH_PASSWORD
  artifacts:
    paths:
      - fastlane/screenshots
