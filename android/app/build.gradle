/**
 * Pulls doppler secrets. Before using run `doppler login`
 */
exec {
    workingDir "$projectDir/../.."

    standardOutput = new FileOutputStream("$workingDir/.env.json")
    executable = 'doppler'
    args = ['secrets', 'download', '--fallback', '.doppler.cache', '--format', 'json', '--no-file']
}

exec {
    workingDir "$projectDir"

    standardOutput = new FileOutputStream("$workingDir/google-services.json")
    executable = 'doppler'
    args = ['secrets', 'get', 'FIREBASE_ANDROID', '--plain']
}


apply plugin: "com.android.application"
apply plugin: 'com.google.gms.google-services'
apply plugin: "com.facebook.react"

apply from: "../../node_modules/react-native-vector-image/strip_svgs.gradle"

import groovy.json.JsonSlurper
import java.util.regex.Pattern

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
/* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    // both version formats are acceptable: 1.0 and 1.0.0
    def versionPattern = Pattern.compile("(\\d.\\d{1,2}(.\\d{1,2})?)", Pattern.CASE_INSENSITIVE)

    def ciPipelineIID = System.getenv("CI_PIPELINE_IID") ? System.getenv("CI_PIPELINE_IID").toInteger() : 1
    def ciCommitTag = System.getenv("CI_COMMIT_TAG") ?: ""
    def ciCommitBranch = System.getenv("CI_COMMIT_BRANCH") ?: ""
    def ciCommitShortSHA = System.getenv("CI_COMMIT_SHORT_SHA")
    def ciCommitTimestamp = System.getenv("CI_COMMIT_TIMESTAMP")
    def ciCommitRefSlug = System.getenv("CI_COMMIT_REF_SLUG")
    def ciProjectName = System.getenv("CI_PROJECT_NAME")

    def defaultVersionName = "0.0.1"
    def tagVersionNameMatcher = versionPattern.matcher(ciCommitTag)
    def branchVersionNameMatcher = versionPattern.matcher(ciCommitBranch)

    def tagVersionName = tagVersionNameMatcher.find() ? tagVersionNameMatcher.group(1) : null
    def branchVersionName = branchVersionNameMatcher.find() ? branchVersionNameMatcher.group(1) : null

    def jsonFile = file("$projectDir/../../.env.json")
    def envJson = new JsonSlurper().parseText(jsonFile.text)

    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "co.neobank.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciPipelineIID
        versionName tagVersionName ?: branchVersionName ?: defaultVersionName

        manifestPlaceholders = [
                BRANCH_KEY: envJson['BRANCH_KEY'],
                BRANCH_DEFAULT_LINK: envJson['BRANCH_DEFAULT_LINK'],
                FACEBOOK_APP_ID: envJson['FACEBOOK_APP_ID'],
                FACEBOOK_CLIENT_TOKEN: envJson['FACEBOOK_CLIENT_TOKEN'],
                FACEBOOK_AUTO_LOGGING: envJson['FACEBOOK_AUTO_LOGGING'],
                FRESHCHAT_APP_KEY: envJson['FRESHCHAT_APP_KEY']
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            String releaseStoreFile = System.getenv('RELEASE_STORE_FILE')

            if (releaseStoreFile != null && !releaseStoreFile.isEmpty()) {
                storeFile file(System.getenv('RELEASE_STORE_FILE'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }

        all {
            buildConfigField 'int', 'CI_PIPELINE_IID', "${ciPipelineIID ?: 1}"
            buildConfigField 'String', 'CI_COMMIT_TAG', "\"${ciCommitTag}\""
            buildConfigField 'String', 'CI_COMMIT_BRANCH', "\"${ciCommitBranch}\""
            buildConfigField 'String', 'CI_COMMIT_SHORT_SHA', "\"${ciCommitShortSHA}\""
            buildConfigField 'String', 'CI_COMMIT_TIMESTAMP', "\"${ciCommitTimestamp}\""
            buildConfigField 'String', 'CI_COMMIT_REF_SLUG', "\"${ciCommitRefSlug}\""
            buildConfigField 'String', 'CI_PROJECT_NAME', "\"${ciProjectName}\""
            buildConfigField 'String', 'CI_COMMIT_TAG', "\"${ciCommitTag}\""
            buildConfigField 'String', 'CI_ENV', "\"${envJson['DOPPLER_ENVIRONMENT']}\""
            buildConfigField 'String', 'CI_ENV_CONFIG', "\"${envJson['DOPPLER_CONFIG']}\""
        }
    }
}

dependencies {
    // rn deps
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }

    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // application deps
    implementation platform('com.google.firebase:firebase-bom:29.0.3')
    implementation('com.airbnb.android:lottie:5.1.1')
    implementation('com.facebook.android:facebook-android-sdk:latest.release')
}

